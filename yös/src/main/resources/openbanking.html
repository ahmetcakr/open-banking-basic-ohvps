<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOS - Açık Bankacılık Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .custom-shadow { box-shadow: 0 4px 20px -5px rgba(0, 0, 0, 0.1); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        body { background-color: #f8fafc; color: #1e293b; }
    </style>
</head>
<body>

    <div class="min-h-screen flex flex-col">
        <header class="bg-slate-900 text-white p-4 shadow-lg">
            <div class="container mx-auto flex justify-between items-center">
                <h1 class="text-xl font-bold flex items-center gap-2">
                    <i class="fas fa-university text-blue-400"></i> Open Banking YOS Terminal
                </h1>
                <div class="text-sm opacity-70">Base URL: http://localhost:7005</div>
            </div>
        </header>

        <main class="container mx-auto p-6 flex-grow">
            <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
                
                <div class="lg:col-span-1 space-y-4">
                    <div class="bg-white p-5 rounded-xl custom-shadow border border-slate-200">
                        <div class="flex justify-between items-center mb-4">
                            <h2 class="font-bold text-slate-700">Diğer Bankalar (HHS)</h2>
                            <button onclick="fetchBanks()" class="text-blue-600 hover:rotate-180 transition-transform duration-500">
                                <i class="fas fa-sync-alt"></i>
                            </button>
                        </div>
                        <div id="bankList" class="space-y-2">
                            <p class="text-sm text-slate-400 italic">Yükleniyor...</p>
                        </div>
                    </div>
                </div>

                <div class="lg:col-span-3 space-y-6">
                    
                    <div class="flex gap-2 border-b border-slate-200">
                        <button onclick="showTab('accounts')" id="tab-accounts" class="px-6 py-2 font-medium text-blue-600 border-b-2 border-blue-600 transition-all">Hesaplarım</button>
                        <button onclick="showTab('balances')" id="tab-balances" class="px-6 py-2 font-medium text-slate-500 hover:text-blue-500 transition-all">Bakiyelerim</button>
                    </div>

                    <div id="content-accounts" class="tab-content active animate-fade-in">
                        <div class="bg-white rounded-xl custom-shadow overflow-hidden border border-slate-200">
                            <table class="w-full text-left">
                                <thead class="bg-slate-50 border-b border-slate-200">
                                    <tr>
                                        <th class="p-4 font-semibold text-slate-600">Hesap No</th>
                                        <th class="p-4 font-semibold text-slate-600">Hesap Sahibi</th>
                                        <th class="p-4 font-semibold text-slate-600 text-center">Para Birimi</th>
                                        <th class="p-4 font-semibold text-slate-600 text-center">Durum</th>
                                    </tr>
                                </thead>
                                <tbody id="accountTableBody">
                                    <tr><td colspan="4" class="p-8 text-center text-slate-400">Veri çekmek için banka seçip onay verin.</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div id="content-balances" class="tab-content animate-fade-in">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="balanceCards">
                            <div class="col-span-full py-8 text-center text-slate-400">Bakiye verisi bulunamadı.</div>
                        </div>
                    </div>

                    <div class="bg-slate-800 rounded-lg p-4 text-xs font-mono text-green-400 h-32 overflow-y-auto">
                        <p>> Terminal hazır. API istekleri bekleniyor...</p>
                        <div id="logOutput"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const BASE_URL = 'http://localhost:7005/open-banking';

        // Sayfa yüklendiğinde bankaları getir
        window.onload = () => {
            fetchBanks();
        };

        function addLog(message) {
            const log = document.getElementById('logOutput');
            const now = new Date().toLocaleTimeString();
            log.innerHTML += `<p class="mt-1">[${now}] ${message}</p>`;
            log.parentElement.scrollTop = log.parentElement.scrollHeight;
        }

        // 1. Banka Listesini Getir
        async function fetchBanks() {
            try {
                const response = await fetch(`${BASE_URL}/getOtherBanks`);
                const banks = await response.json();
                const bankList = document.getElementById('bankList');
                bankList.innerHTML = '';

                banks.forEach(bank => {
                    bankList.innerHTML += `
                        <div class="p-3 border border-slate-100 rounded-lg hover:bg-blue-50 transition-colors group">
                            <div class="flex justify-between items-center">
                                <div>
                                    <p class="font-bold text-slate-700">${bank.bankName}</p>
                                    <p class="text-xs text-slate-400">${bank.code}</p>
                                </div>
                                <button onclick="shareAccount('${bank.code}')" class="bg-blue-100 text-blue-600 px-3 py-1 rounded text-xs font-bold hover:bg-blue-600 hover:text-white transition-all">
                                    Onayla
                                </button>
                            </div>
                        </div>
                    `;
                });
                addLog('Banka listesi güncellendi.');
            } catch (err) {
                addLog('Hata: Bankalar çekilemedi. Backend ayakta mı?');
            }
        }

        // 2. Rıza/Paylaşım İsteği At (POST)
        async function shareAccount(hhsCode) {
            addLog(`${hhsCode} için rıza isteği gönderiliyor...`);
            try {
                const response = await fetch(`${BASE_URL}/requestMyAccountInfoToOtherBank`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ hhsCode: hhsCode })
                });
                const result = await response.text();
                addLog(`Sonuç: ${result}`);
                
                // Paylaşım başarılıysa otomatik verileri çek
                refreshAllData();
            } catch (err) {
                addLog('Hata: Paylaşım isteği başarısız.');
            }
        }

        // 3. Hesapları ve Bakiyeleri Getir
        async function refreshAllData() {
            fetchAccounts();
            fetchBalances();
        }

        async function fetchAccounts() {
            try {
                const response = await fetch(`${BASE_URL}/getMyAccountsFromOtherBank`);
                const data = await response.json();
                const tbody = document.getElementById('accountTableBody');
                tbody.innerHTML = '';

                data.forEach(acc => {
                    tbody.innerHTML += `
                        <tr class="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                            <td class="p-4 font-mono text-sm">${acc.accountNo}</td>
                            <td class="p-4">${acc.accountOwner}</td>
                            <td class="p-4 text-center"><span class="bg-slate-200 px-2 py-1 rounded text-xs font-bold">${acc.currency}</span></td>
                            <td class="p-4 text-center">
                                ${acc.active ? '<span class="text-green-500"><i class="fas fa-check-circle"></i></span>' : '<span class="text-red-400"><i class="fas fa-times-circle"></i></span>'}
                            </td>
                        </tr>
                    `;
                });
                addLog('Hesap bilgileri güncellendi.');
            } catch (err) { addLog('Hata: Hesaplar çekilemedi.'); }
        }

        async function fetchBalances() {
            try {
                const response = await fetch(`${BASE_URL}/getMyBalancesFromOtherBank`);
                const data = await response.json();
                const container = document.getElementById('balanceCards');
                container.innerHTML = '';

                data.forEach(bal => {
                    container.innerHTML += `
                        <div class="bg-gradient-to-br from-white to-blue-50 p-5 rounded-xl border border-blue-100 shadow-sm">
                            <p class="text-xs text-slate-400 font-bold uppercase tracking-wider">${bal.accountNo}</p>
                            <div class="flex justify-between items-end mt-2">
                                <span class="text-2xl font-black text-slate-800">${bal.balanceAmount}</span>
                                <span class="text-blue-600 font-bold">${bal.currency}</span>
                            </div>
                        </div>
                    `;
                });
                addLog('Bakiye bilgileri güncellendi.');
            } catch (err) { addLog('Hata: Bakiyeler çekilemedi.'); }
        }

        // Tab Yönetimi
        function showTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('[id^="tab-"]').forEach(el => {
                el.classList.remove('text-blue-600', 'border-b-2', 'border-blue-600');
                el.classList.add('text-slate-500');
            });

            document.getElementById(`content-${tabName}`).classList.add('active');
            document.getElementById(`tab-${tabName}`).classList.add('text-blue-600', 'border-b-2', 'border-blue-600');
            document.getElementById(`tab-${tabName}`).classList.remove('text-slate-500');
        }
    </script>
</body>
</html>
